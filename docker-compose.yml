# Meme Studio Pro — Docker
# Toda la configuración va en .env (ver .env.example): copialo a .env y
# docker compose lo integra interpola/inyecta en el contenedor con estos
# valores por defecto.

services:
  memestudio:
    build: .
    # Imagen publicada en Docker Hub (multi-arch: amd64 PC + arm64 Raspberry
    # Pi). Sin imagen local, `docker compose up -d` LA DESCARGA del registro;
    # con `--build` recompila localmente y etiqueta con este mismo nombre.
    image: l20j45/memestudio:latest
    container_name: memestudio
    restart: unless-stopped
    ports:
      # HOST_PORT (host) -> 5005 (fijo dentro del contenedor, ver .env.example)
      - "${HOST_PORT:-5005}:5005"
    environment:
      # Configuración (todo documentado en .env.example)
      - REMBG_MODEL=${REMBG_MODEL:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - REDDIT_SUBS=${REDDIT_SUBS:-}
      - REDDIT_TERMS=${REDDIT_TERMS:-}
      - MEME_CACHE_TTL=${MEME_CACHE_TTL:-300}
      - IMG_CACHE_MAX=${IMG_CACHE_MAX:-120}
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-10}
      - MAX_REMOVAL_CONCURRENCY=${MAX_REMOVAL_CONCURRENCY:-2}
      - PREWARM_MODEL=${PREWARM_MODEL:-0}
      # Acceso con contrasena + borradores remotos (ver .env.example)
      - AUTH_USERS=${AUTH_USERS:-}
      # Login con cuentas (registro en la UI; ver .env.example)
      - REQUIRE_LOGIN=${REQUIRE_LOGIN:-1}
      - REGISTRATION_OPEN=${REGISTRATION_OPEN:-1}
      - SESSION_DAYS=${SESSION_DAYS:-30}
      - AUTH_DB=/app/data/memestudio.db
      - PUBLIC_HTTPS=${PUBLIC_HTTPS:-}
      - DRAFT_DIR=/app/drafts
      - DRAFT_MAX_MB=${DRAFT_MAX_MB:-25}
      # Dentro del contenedor el puerto/puerto base es siempre 5005
      - PORT=5005
    volumes:
      # Persistent rembg model cache (both possible locations it uses)
      - models:/root/.u2net
      - models:/root/.rembg
      # Borradores remotos por usuario (sincronizacion movil <-> PC)
      - drafts:/app/drafts
      # Base de datos de cuentas y sesiones del login
      - data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:5005/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    # On a Raspberry Pi, limit memory for the full model
    # mem_limit: 2g

volumes:
  models:
  drafts:
  data:
