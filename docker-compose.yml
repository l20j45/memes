# Meme Studio Pro — todo-en-uno en Docker (frontend + API de IA).
# Uso:
#   docker compose up -d --build        # arrancar
#   docker compose logs -f memestudio   # ver logs
#   docker compose down                 # parar
#
# Gracias al volumen "models", los pesos de rembg se descargan UNA sola vez
# (la primera petición) y persisten entre reinicios y actualizaciones de imagen.

services:
  memestudio:
    build: .
    image: memestudio
    container_name: memestudio
    restart: unless-stopped
    ports:
      - "5005:5005"
    environment:
      # Empty => automatic model selection (u2netp on ARM, u2net on x86).
      # Examples: REMBG_MODEL=u2netp | u2net | isnet-general-use
      - REMBG_MODEL=${REMBG_MODEL:-}
      - PORT=5005
    volumes:
      # Persistent rembg model cache (both possible locations it uses)
      - models:/root/.u2net
      - models:/root/.rembg
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:5005/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    # On a Raspberry Pi, limit memory for the full model
    # mem_limit: 2g

volumes:
  models:
